name: Release

# 触发方式：
#   1) 推送形如 v1.0.0 的 tag  → 自动编译并发布对应 Release
#   2) 手动触发（Actions → Release → Run workflow）→ 需填一个已存在的 tag，
#      用于「重新构建 / 重发同一版本」（幂等，会覆盖已有资产）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布或重建的 tag（例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write      # 创建 / 更新 Release
  id-token: write      # 构建溯源证明需要 OIDC 令牌
  attestations: write  # 写入 attestation

# 同一 tag 的重复触发只保留最新一次，避免并发写同一个 Release
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 编译并发布 Windows 可执行文件
    runs-on: windows-latest

    env:
      # push tag 时取 tag 名；手动触发时取输入的 tag
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # 与本地验证过并通过 check_frozen_scan.py 的版本严格对齐。
      # 升级任一版本后必须重跑冻结回归测试，否则 SysScanGUI.spec 的剔除规则可能失效。
      PYINSTALLER_VERSION: '6.22.2'
      HOOKS_CONTRIB_VERSION: '2026.7'
      PYSIDE_VERSION: '6.11.2'
      PSUTIL_VERSION: '7.2.2'
      # 代码签名的总开关：配置了 SignPath 的 project slug 就启用签名。
      # 未配置时下面所有签名相关步骤都会自动跳过，流水线照常产出未签名 exe，
      # 因此拿到证书之前无需改动本文件。
      # 显式产出 'true'/'false' 字符串，避免依赖布尔值序列化的写法差异
      SIGNING_ENABLED: ${{ vars.SIGNPATH_PROJECT_SLUG != '' && 'true' || 'false' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装构建依赖（版本锁定）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            "psutil==$env:PSUTIL_VERSION" `
            "PySide6-Essentials==$env:PYSIDE_VERSION" `
            "pyinstaller==$env:PYINSTALLER_VERSION" `
            "pyinstaller-hooks-contrib==$env:HOOKS_CONTRIB_VERSION"

      - name: 编译（PyInstaller onefile）
        run: python -m PyInstaller --noconfirm --clean SysScanGUI.spec

      - name: 校验产物存在性与体积
        shell: pwsh
        run: |
          $exe = 'dist\SysScanGUI.exe'
          if (-not (Test-Path $exe)) { throw "编译未产出 $exe" }
          $size = (Get-Item $exe).Length
          $mib = $size / 1MB
          Write-Host ("SysScanGUI.exe = {0:N0} 字节（{1:N2} MiB）" -f $size, $mib)
          # 体积回归护栏：未优化包约 39 MiB，剔除后约 21.6 MiB。
          # 一旦剔除规则失效导致体积明显回升，应当直接失败，而不是发布一个膨胀的包。
          if ($mib -gt 30) { throw ("体积异常：{0:N2} MiB > 30 MiB，SysScanGUI.spec 的剔除规则可能已失效" -f $mib) }
          if ($mib -lt 10) { throw ("体积异常：{0:N2} MiB < 10 MiB，产物可能不完整" -f $mib) }

      # ==================== 代码签名（SignPath Foundation）====================
      # 启用条件：仓库 Variable 里配置了 SIGNPATH_PROJECT_SLUG。
      # 需要配置的项（Settings → Secrets and variables → Actions）：
      #   Secrets   : SIGNPATH_API_TOKEN、SIGNPATH_ORGANIZATION_ID
      #   Variables : SIGNPATH_PROJECT_SLUG、SIGNPATH_SIGNING_POLICY_SLUG
      # 说明：证书以 SignPath Foundation 的名义签发（开源项目免费签名计划），
      #      私钥保存在对方 HSM 内，我们只提交产物、取回已签名产物。

      - name: 核对签名配置完整性
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SP_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SP_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          # 开关已打开却漏配凭据时立刻失败，避免「静默跳过签名却以为签上了」
          $missing = @()
          if (-not $env:SP_TOKEN)  { $missing += 'SIGNPATH_API_TOKEN（secret）' }
          if (-not $env:SP_ORG)    { $missing += 'SIGNPATH_ORGANIZATION_ID（secret）' }
          if (-not $env:SP_POLICY) { $missing += 'SIGNPATH_SIGNING_POLICY_SLUG（variable）' }
          if ($missing.Count -gt 0) {
            throw ("已启用代码签名但缺少配置：{0}" -f ($missing -join '、'))
          }
          Write-Host '签名配置齐备'

      - name: 上传待签名产物
        if: env.SIGNING_ENABLED == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/SysScanGUI.exe
          if-no-files-found: error
          retention-days: 1

      # SignPath 侧需要在 Artifact Configuration 里声明「这个包中有一个 PE 文件、需要 Authenticode 签名」。
      # 若项目已配置默认 Artifact Configuration，可不传该项；需要指定时补一行：
      #   artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      - name: 提交签名请求并取回已签名产物
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      # 签名会改变文件字节 → 这一步必须发生在「生成 SHA256 校验和」之前，
      # 否则发布的校验和与线上的已签名 exe 对不上。
      - name: 用已签名产物替换编译产物
        shell: pwsh
        run: |
          $signed = 'dist-signed\SysScanGUI.exe'
          if (Test-Path $signed) {
            Copy-Item $signed 'dist\SysScanGUI.exe' -Force
            Write-Host '已用签名产物替换 dist\SysScanGUI.exe'
          } elseif ($env:SIGNING_ENABLED -eq 'true') {
            throw '已启用代码签名，但没有拿到签名产物'
          } else {
            Write-Host '未启用代码签名，沿用编译产物'
          }

      - name: 校验 Authenticode 签名
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature (Resolve-Path 'dist\SysScanGUI.exe').Path
          Write-Host ("签名状态：{0}" -f $sig.Status)
          if ($sig.SignerCertificate) {
            Write-Host ("签署者：{0}" -f $sig.SignerCertificate.Subject)
            Write-Host ("颁发者：{0}" -f $sig.SignerCertificate.Issuer)
          }
          if ($sig.TimeStamperCertificate) {
            Write-Host ("时间戳：{0}" -f $sig.TimeStamperCertificate.Subject)
          }
          # 时间戳是必须的：没有它，证书一过期所有历史签名的有效性一起失效
          if (-not $sig.TimeStamperCertificate) { throw '签名缺少 RFC 3161 时间戳' }
          if ($sig.Status -ne 'Valid') {
            throw ("签名校验未通过：{0} —— {1}" -f $sig.Status, $sig.StatusMessage)
          }
          Write-Host '签名校验通过'

      # =========================================================================

      # 放在签名之后：这样它同时验证了「签名没有破坏 exe 本身」
      - name: 冒烟测试（冻结 exe 实际启动一次）
        shell: pwsh
        run: |
          $exeDir = (Resolve-Path 'dist').Path
          $exe = Join-Path $exeDir 'SysScanGUI.exe'
          # 注意：冻结后 gui.py 的 HERE = exe 所在目录（而非当前工作目录），
          # 所以 --smoke 把结果写在 dist\smoke_result.json。两个位置都查，
          # 避免因为「文件其实写了、只是找错地方」而误报失败。
          $candidates = @(
            (Join-Path $PWD 'smoke_result.json'),
            (Join-Path $exeDir 'smoke_result.json')
          )
          $ok = $false
          foreach ($attempt in 1..2) {
            if ($attempt -eq 2) {
              # 兜底：CI 无交互桌面时改用 offscreen 平台插件。
              # 这一步只验证「进程能起来、采样链路能跑通」，不涉及渲染效果。
              $env:QT_QPA_PLATFORM = 'offscreen'
              Write-Host '第 2 次尝试：QT_QPA_PLATFORM=offscreen'
            }
            $candidates | ForEach-Object { Remove-Item -Force -ErrorAction SilentlyContinue $_ }

            $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru
            if (-not $p.WaitForExit(90000)) {
              $p.Kill()
              Write-Host "第 $attempt 次尝试超时（90s），已终止进程"
              continue
            }
            Write-Host "第 $attempt 次尝试退出码 = $($p.ExitCode)"

            $hit = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($p.ExitCode -ne 0) { Write-Host '退出码非 0，判定失败'; continue }
            if (-not $hit) { Write-Host '未找到 smoke_result.json，判定失败'; continue }

            Write-Host "--- 冒烟结果（$hit）---"
            Get-Content $hit -Raw
            try {
              $json = Get-Content $hit -Raw | ConvertFrom-Json
            } catch {
              Write-Host "结果不是合法 JSON：$_"
              continue
            }
            # 结果必须是「真采到了数据」，不能是个空壳
            if (-not $json.rows) { Write-Host '结果缺少 rows 字段'; continue }
            $rowCount = ($json.rows.PSObject.Properties | Measure-Object).Count
            if ($rowCount -lt 5) { Write-Host "rows 只有 $rowCount 类，数据不完整"; continue }
            Write-Host ("指标：cpu={0}% mem={1}% gpu={2}% cpu_temp={3} gpu_temp={4}" -f `
              $json.cpu_pct, $json.mem_pct, $json.gpu_util, $json.cpu_temp_c, $json.gpu_temp_c)
            $ok = $true
            break
          }
          $candidates | ForEach-Object { Remove-Item -Force -ErrorAction SilentlyContinue $_ }
          if (-not $ok) { throw '冒烟测试失败：--smoke 未正常退出，或未产出完整有效的 smoke_result.json' }

      # 构建溯源证明：把「这个产物确实由本仓库本次 CI 编译」写进 GitHub 的签名透明日志。
      # 它不改变 exe 本身，也不影响 SmartScreen，但用户可用 gh attestation verify 核对来源。
      - name: 生成构建溯源证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SysScanGUI.exe

      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist\SysScanGUI.exe' -Algorithm SHA256).Hash.ToLower()
          # 用 LF 换行写标准格式，便于 GNU coreutils 的 sha256sum -c 直接校验
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'SHA256SUMS.txt'),
            "$hash  SysScanGUI.exe`n",
            (New-Object Text.UTF8Encoding $false)
          )
          Get-Content SHA256SUMS.txt

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $date = (Get-Date).ToString('yyyy-MM-dd')

          if ($env:SIGNING_ENABLED -eq 'true') {
            $signingText = '- 已做代码签名，签署者为 SignPath Foundation（开源项目免费签名计划），私钥保存在对方 HSM 内。'
          } else {
            $signingText = '- **本版 exe 未做代码签名**，首次运行可能触发 SmartScreen 提示（点「更多信息 → 仍要运行」）。'
          }

          $notes = @'
          ## SysScanGUI {TAG}

          Windows 系统进程与服务安全扫描器——完整枚举进程、服务、网络连接与持久化项，
          按一套可解释的规则给出风险等级，并可在界面内直接处置与回滚。
          **程序不联网，不上传任何数据。**

          ### 运行要求

          - Windows 10 / 11（64 位）
          - **无需安装 Python**，双击 `SysScanGUI.exe` 即可运行
          - 普通权限可用；以管理员身份运行可获得更完整的服务与进程信息

          ### 下载

          | 文件 | 说明 |
          |---|---|
          | `SysScanGUI.exe` | 单文件绿色版，约 21.6 MiB，即下即用 |
          | `SHA256SUMS.txt` | 校验和 |

          校验下载完整性：

          ```powershell
          Get-FileHash .\SysScanGUI.exe -Algorithm SHA256
          # 或
          certutil -hashfile SysScanGUI.exe SHA256
          ```

          结果应与 `SHA256SUMS.txt` 中的值一致。

          ### 代码签名与来源验证

          {SIGNING}

          核对该产物确实由本仓库的 CI 编译（需要 GitHub CLI）：

          ```bash
          gh attestation verify SysScanGUI.exe --repo ${{ github.repository }}
          ```

          注意：SmartScreen 的信誉来自「文件哈希 + 发布者证书」的下载历史累积，
          **签名不等于首次下载零提示**。请以本页的 SHA256 与溯源证明为准核对产物。

          ### 本版包含

          - 进程 / 服务 / 网络连接 / 计划任务 / 启动项全量采集，含数字签名、运行身份、父进程、命令行
          - 可解释的风险规则：路径可信度分级、系统进程名伪装、LOLBAS 命令行特征、服务与网络专项检查
          - 六视图图形界面，支持关键字搜索、风险等级过滤、**点击列标题排序**
          - 实时硬件指标：CPU / 内存 / GPU 使用率、显存占用、CPU 温度、GPU 温度
          - 分层自动刷新：概览指标常刷 + 连接轻刷（可选）+ 处置后自动核实
          - 处置与回滚：结束进程、停用/禁用服务、删除计划任务与启动项，每步留操作历史
          - 单实例保护：同一时间只允许一个实例运行
          - 导出 JSON / HTML / CSV 报告

          ### 已知限制

          - GPU 温度在多数集成显卡机器上不可用；CPU 温度在未运行 LibreHardwareMonitor 时取自 ACPI 热区，
            界面会如实标注来源——**拿不到的数据一律显示 `—`，不会填假数字**
          - 单文件版运行时，进程表里会同时出现两个同名进程（PyInstaller 的引导器 + 应用本体，
            命令行完全相同）：这是单文件打包的固定结构，**不是「旧实例没退出」**。程序会把自身
            进程标注为「本程序自身进程」并跳过风险判定，不会把自己的进程报成未签名风险项
          - 扫描结果为启发式判定，存在误报与漏报，仅供排查参考，**不能替代专业安全软件的实时防护**
          - 处置动作（结束进程 / 停用服务 / 删除启动项）具有破坏性，请先确认目标可以安全处置

          完整文档见仓库 [README](https://github.com/${{ github.repository }}#readme)。

          ---

          构建信息：由 GitHub Actions 在 `windows-latest` 上编译，Python 3.11，
          PySide6-Essentials {PYSIDE} + PyInstaller {PYI}。构建日期 {DATE}。

          **免责声明**：本工具会执行终止进程、停止/禁用服务等破坏性操作，作者不对因使用本工具
          造成的任何数据丢失或系统损坏承担责任，请自行评估风险。
          '@
          # 去掉 YAML 块缩进在 here-string 里留下的 10 个前导空格
          $notes = ($notes -split "`n" | ForEach-Object { $_.TrimStart(' ') }) -join "`n"
          $notes = $notes.Replace('{TAG}', $tag)
          $notes = $notes.Replace('{PYSIDE}', $env:PYSIDE_VERSION)
          $notes = $notes.Replace('{PYI}', $env:PYINSTALLER_VERSION)
          $notes = $notes.Replace('{DATE}', $date)
          $notes = $notes.Replace('{SIGNING}', $signingText)
          [IO.File]::WriteAllText((Join-Path $PWD 'release_notes.md'), $notes, (New-Object Text.UTF8Encoding $false))

          $assets = @('dist\SysScanGUI.exe', 'SHA256SUMS.txt')

          # 幂等：已存在的 Release 改为更新说明 + 覆盖资产（支持手动重跑同一 tag）
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在 → 更新说明并覆盖资产"
            gh release edit $tag --title "SysScanGUI $tag" --notes-file release_notes.md
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit 失败' }
            gh release upload $tag @assets --clobber
          } else {
            Write-Host "创建 Release $tag"
            gh release create $tag --title "SysScanGUI $tag" --notes-file release_notes.md @assets
          }
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败' }

          gh release view $tag

      - name: 汇总
        shell: pwsh
        run: |
          $size = (Get-Item 'dist\SysScanGUI.exe').Length / 1MB
          $hash = (Get-Content 'SHA256SUMS.txt').Split(' ')[0]
          $signed = if ($env:SIGNING_ENABLED -eq 'true') { '已签名' } else { '未签名' }
          $lines = @(
            "### Release $env:RELEASE_TAG",
            "",
            "- 产物：``SysScanGUI.exe``（{0:N2} MiB）" -f $size,
            "- SHA256：``$hash``",
            "- 代码签名：$signed",
            "- 溯源证明：已生成（``gh attestation verify``）",
            "- 运行环境：windows-latest / Python 3.11 / PySide6-Essentials $env:PYSIDE_VERSION",
            "- 页面：https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_TAG"
          )
          [IO.File]::AppendAllText(
            $env:GITHUB_STEP_SUMMARY,
            ($lines -join "`n") + "`n",
            (New-Object Text.UTF8Encoding $false)
          )
